# hamsterwheel.toml — the loop's only repo-specific knowledge.
# Copy to `hamsterwheel.toml` at your repo root (or let `hamsterwheel init` write it) and edit.
# Every value below is shown with its default; only `repo`, a project reference and at least one
# path-based [[human]] rule are required.
# NOTE: TOML tables ([scripts], [[human]], [project]…) claim every `key = value` after their header,
# so ALL top-level keys stay in this first section.

# REQUIRED. The repo whose issues the loop works.
repo = "acme/backend"

base_branch = "main"
branch_prefix = "loop" # branches are <prefix>/<issue>-<slug>
criteria_heading = "Acceptance Criteria"
# smoke_cmd = "bun run smoke"   # optional post-merge check; failures notify, never auto-rollback

# Extra repos whose open issues `triage --sync` folds onto the board (e.g. a public triage inbox).
source_repos = ["acme/backend"]

session_timeout_ms = 3600000 # kill a stalled implement session after 60m
ci_timeout_ms = 900000 # give up waiting for checks after 15m (→ Blocked: ci-red)
max_diff_bytes = 60000 # diff slice handed to the rubric grader
max_iterations = 50 # `run` backstop: never loop forever
max_review_rounds = 4 # cap on stateless review-fix rounds; they never converge unbounded
# worktree_root = "~/.hamsterwheel/worktrees"

# Sessions run in persistent worktree "lanes" (lane-0…lane-N-1) reused across issues — node_modules
# and caches stay warm; each acquire salvages leftovers, resets, re-branches off the fresh base and
# re-copies .worktreeinclude files. >1 is reserved for parallel wave mode (accepted, currently inert).
worktree_lanes = 1

# Scoped tool allow-list for a claude implement session. No blanket Bash(*) and no arbitrary-read
# shells. This is defense-in-depth, NOT isolation — the sandbox is the boundary.
allowed_tools = [
  "Edit",
  "Read",
  "Write",
  "Glob",
  "Grep",
  "TodoWrite",
  "Bash(git:*)",
  "Bash(gh:*)",
  "Bash(bun:*)",
]

# ---- lifecycle scripts -----------------------------------------------------------------------
# `setup` runs in the lane after EVERY acquire (cold create and warm reuse) before the session.
# It is argv-exec'd without a shell — no pipes/&&/globs; anything compound belongs in a repo script
# (which is also what Conductor/Cursor/Codex-style setups converge on). Env vars provided:
#   HAMSTER_WORKSPACE_PATH  lane directory        HAMSTER_WORKSPACE_NAME  "lane-0"
#   HAMSTER_ROOT_PATH       primary checkout      HAMSTER_LANE_COLD       "1" fresh / "0" warm
#   HAMSTER_ISSUE           issue number          HAMSTER_RUN_ID          run id
# Absent → no setup step. `run` / `archive` / `maintenance` are reserved for later.
[scripts]
setup = "bun install"
# setup = "./scripts/setup.sh"

# ---- human-review tripwires ------------------------------------------------------------------
# Named rules that mean "this work is never auto-merged" → the PR parks as Blocked: needs-human
# with the rule name(s) in the reason. A rule fires when the PR's changed files match `paths`
# (case-insensitive regex) OR the issue carries one of `labels`. Err wide: a false positive just
# routes a PR to a human, a false negative auto-merges something a human should have seen.
# REQUIRED: at least one rule with `paths` (so a schema migration can never auto-merge by omission).
[[human]]
name = "prod-migration"
paths = "(^|/)(migrations|drizzle)/"

# [[human]]
# name = "sensitive-domain"
# labels = ["security", "auth", "payments"]

# [[human]]
# name = "crypto-code"
# paths = "(^|/)(security|crypto)/"

# ---- control plane: GitHub Projects v2 -------------------------------------------------------
[project]
# number OR title is required. `hamsterwheel init` fills `number` in after provisioning the board.
number = 3
title = "backend Loop"
# owner = "acme"                # defaults to the owner segment of `repo`

# Board field + option NAMES. Nothing is hardcoded — point these at whatever your board already uses.
[board]
status_field = "Status"
owner_field = "Owner" # text field; the atomic claim writes the run id here
blocked_reason_field = "Blocked reason"

[board.status]
draft = "Draft"
ready = "Ready"
in_progress = "In Progress"
in_review = "In Review"
blocked = "Blocked"
done = "Done"

[board.blocked_reasons]
needs_criteria = "needs-criteria"
needs_human = "needs-human"
needs_decision = "needs-decision"
dep_open = "dep-open"
ci_red = "ci-red"
rubric_fail = "rubric-fail"

# ---- review gate -----------------------------------------------------------------------------
[review]
# How much a server-side review is worth to the merge gate:
#   optional (default) — honoured if present, never required. CI plus the adversarial rubric grader
#                        carry the decision, on the view that reviewing may well have happened locally.
#   required           — a review covering the CURRENT head must exist. Only correct when a review bot
#                        reliably posts on every PR; otherwise every PR parks as needs-decision, and
#                        the reason it prints is indistinguishable from a broken reviewer.
#   off                — reviews are never fetched. No API calls, and a human's "Request changes" is
#                        NOT seen — use branch protection if that veto must hold regardless.
# `required` and `optional` both block on a CHANGES_REQUESTED review from anyone, body text aside.
mode = "optional"
bot = "claude[bot]" # login whose PR review the merge gate reads
# Lines matching this in the bot's review body BLOCK the merge. Nits/low/medium don't; high/critical do.
blocking_severity_regex = "\\(\\s*(high|critical)\\s*\\)|🔴|\\[(critical|high)\\]|severity:\\s*(high|critical)"

# ---- runner policy ---------------------------------------------------------------------------
# Defaults per role. Per-issue `loop:*` labels override any axis (see the issue contract in your
# CLAUDE.md / AGENTS.md). strong_model/cheap_model feed the built-in heuristic when no model is pinned:
# P0/P1 or size >= M → strong; XS or docs/test/chore/style/ci-shaped → cheap.
[runners.implement]
runner = "claude" # claude | codex | opencode
strong_model = "opus"
cheap_model = "sonnet"
# model = "claude-opus-5"       # pin a model and the heuristic is skipped
effort = "high" # claude: low|medium|high|xhigh|max · codex: minimal|low|medium|high · opencode: minimal|low|medium|high|max

[runners.review]
runner = "claude"
strong_model = "opus"
cheap_model = "sonnet"
effort = "high"
