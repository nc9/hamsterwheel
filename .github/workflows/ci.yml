name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      - name: typecheck
        run: |
          for pkg in packages/runners packages/gate packages/config packages/sandbox apps/cli; do
            echo "── $pkg"
            (cd "$pkg" && bunx tsgo --noEmit)
          done
